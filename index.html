<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOHN - Birthday Invitation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at top, #172554 0%, #090d1e 65%, #04060e 100%);
      color: #ffffff;
      overflow-x: hidden;
    }

    /* طبقة النجوم لا تعترض النقر أبداً */
    #starsLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fffbeb;
      box-shadow: 0 0 8px rgba(254, 240, 138, 0.9);
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    /* شاشة البداية: السماء والقمر الذهبي */
    #skyScreen {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    #skyScreen.hidden {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
      position: fixed;
      inset: 0;
    }

    .hint-top {
      font-size: 1rem;
      color: #fde68a;
      letter-spacing: 0.4px;
    }

    /* زر القمر مضمون الاستجابة */
    #moonBtn {
      position: relative;
      z-index: 10;
      width: 190px;
      height: 190px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: radial-gradient(circle at 32% 28%, #fffbeb 0%, #fde047 38%, #eab308 75%, #a16207 100%);
      box-shadow:
        0 0 35px rgba(250, 204, 21, 0.65),
        0 0 80px rgba(234, 179, 8, 0.35),
        inset -16px -18px 28px rgba(120, 53, 15, 0.38);
      animation: floatMoon 3.5s ease-in-out infinite;
      transition: transform 0.2s ease;
    }

    #moonBtn:hover {
      transform: scale(1.05);
    }

    #moonBtn:active {
      transform: scale(0.95);
    }

    .crater {
      position: absolute;
      border-radius: 50%;
      background: rgba(146, 64, 14, 0.18);
      box-shadow: inset 2px 2px 4px rgba(120, 53, 15, 0.25);
      pointer-events: none;
    }

    .c1 { width: 34px; height: 34px; top: 32px; left: 42px; }
    .c2 { width: 22px; height: 22px; top: 82px; right: 34px; }
    .c3 { width: 26px; height: 26px; bottom: 38px; left: 56px; }

    @keyframes floatMoon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .tap-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(253, 224, 71, 0.4);
      padding: 10px 20px;
      border-radius: 999px;
    }

    /* شاشة الدعوة بعد النقر على القمر */
    #inviteScreen {
      display: none;
      position: relative;
      z-index: 5;
      min-height: 100vh;
      padding: 28px 16px 48px;
      align-items: center;
      justify-content: center;
    }

    #inviteScreen.active {
      display: flex;
      animation: fadeUp 0.55s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, rgba(17, 29, 68, 0.92) 0%, rgba(10, 16, 38, 0.96) 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.45);
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

      box-shadow:

        inset -14px -16px 26px rgba(133, 77, 14, 0.3);
      color: #1e1b4b;
      display: flex;
