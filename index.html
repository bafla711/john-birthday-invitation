<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>John's 7th Cosmic Birthday Invitation</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Rich Display, Script & Arabic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@500;600;700&family=Great+Vibes&family=Luckiest+Guy&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --sky-deep: #020512;
      --sky-mid: #081234;
      --gold-light: #fff9db;
      --gold-mid: #ffd15c;
      --gold-rich: #d98218;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--sky-deep);
      color: #ffffff;
      font-family: 'Fredoka', 'Tajawal', sans-serif;
      overflow-x: hidden;
    }

    .font-arabic { font-family: 'Tajawal', sans-serif; }
    .font-script-gold { font-family: 'Great Vibes', cursive; }
    .font-royal-gold { font-family: 'Cinzel Decorative', serif; }
    .font-bold-display { font-family: 'Luckiest Guy', cursive; }

    /* Hyper-Realistic 3D Volumetric Moon Typography */
    .moon-birthday-script {
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(180deg, #8c4a08 0%, #5c2d04 55%, #3d1c02 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 0 rgba(255, 252, 230, 0.9)) drop-shadow(0 2px 4px rgba(92, 45, 4, 0.25));
    }

    .moon-john-3d {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      background: linear-gradient(180deg, #3a1d06 0%, #1e1238 52%, #0e0821 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 1.5px 0 rgba(255, 250, 224, 0.95))
        drop-shadow(0 4px 8px rgba(15, 23, 42, 0.35));
      letter-spacing: 0.04em;
    }

    .moon-turning-label {
      color: #4a280a;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
      letter-spacing: 0.14em;
    }

    .moon-ornate-seven {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      background: linear-gradient(180deg, #fff59d 0%, #ffb300 45%, #c66900 85%, #7f3900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1.5px #3b1c03;
      paint-order: stroke fill;
      filter:
        drop-shadow(0 3px 0 #3b1c03)
        drop-shadow(0 0 14px rgba(255, 193, 7, 0.85));
      display: inline-block;
      animation: sevenGlowFloat 2.8s ease-in-out infinite;
    }

    @keyframes sevenGlowFloat {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.09) translateY(-2px); }
    }

    /* Stage 1: Night Sky Curtains */
    .sky-curtain-wrapper {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: auto;
      overflow: hidden;
      transition: visibility 1.35s ease;
    }

    .sky-curtain-wrapper.opened {
      pointer-events: none;
      visibility: hidden;
    }

    .sky-half {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.6%;
      background:
        radial-gradient(circle at 28% 22%, rgba(56, 102, 235, 0.24), transparent 55%),
        radial-gradient(circle at 72% 78%, rgba(139, 92, 246, 0.22), transparent 55%),
        linear-gradient(180deg, #02040f 0%, #07102c 50%, #030718 100%);
      transition: transform 1.35s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease;
      will-change: transform;
    }

    .sky-half-left {
      left: 0;
      border-right: 1px solid rgba(255, 220, 125, 0.16);
    }

    .sky-half-right {
      right: 0;
      border-left: 1px solid rgba(255, 220, 125, 0.16);
    }

    .sky-curtain-wrapper.opened .sky-half-left {
      transform: translateX(-105%);
      opacity: 0.15;
    }

    .sky-curtain-wrapper.opened .sky-half-right {
      transform: translateX(105%);
      opacity: 0.15;
    }

    /* Interactive Hyper-Realistic 3D Golden Moon Trigger */
    .moon-trigger-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 45;
      padding: 1.5rem;
      transition: opacity 0.65s ease, transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sky-curtain-wrapper.opened .moon-trigger-stage {
      opacity: 0;
      transform: scale(2.1);
      pointer-events: none;
    }

    .golden-moon-btn {
      position: relative;
      width: min(58vw, 245px);
      height: min(58vw, 245px);
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      overflow: hidden;
      background: radial-gradient(circle at 34% 30%, #fffdf2 0%, #ffe699 36%, #f5b942 75%, #c77812 100%);
      box-shadow:
        0 0 45px rgba(255, 221, 115, 0.78),
        0 0 110px rgba(255, 184, 52, 0.5),
        0 0 180px rgba(255, 152, 0, 0.3),
        inset -20px -22px 42px rgba(138, 72, 6, 0.52),
        inset 14px 14px 30px rgba(255, 255, 245, 0.92);
      animation: moonBreathe 3.4s ease-in-out infinite;
      transition: transform 0.25s ease;
    }

    .golden-moon-btn:hover { transform: scale(1.05); }
    .golden-moon-btn:active { transform: scale(0.95); }

    .moon-corona-ring {
      position: absolute;
      inset: -24px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 228, 145, 0.35);
      box-shadow: 0 0 35px rgba(255, 210, 95, 0.28);
      animation: coronaPulse 3.4s ease-in-out infinite;
      pointer-events: none;
    }

    .moon-orbit-track {
      position: absolute;
      inset: -38px;
      border-radius: 9999px;
      border: 1px dashed rgba(255, 232, 163, 0.42);
      animation: slowSpin 22s linear infinite;
      pointer-events: none;
    }

    .moon-orbit-track::after {
      content: '✦';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff6cc;
      font-size: 18px;
      text-shadow: 0 0 12px #ffd54f;
    }

    @keyframes moonBreathe {
      0%, 100% {
        transform: scale(1) translateY(0);
        box-shadow:
          0 0 45px rgba(255, 221, 115, 0.75),
          0 0 110px rgba(255, 184, 52, 0.48),
          inset -20px -22px 42px rgba(138, 72, 6, 0.52),
          inset 14px 14px 30px rgba(255, 255, 245, 0.92);
      }
      50% {
        transform: scale(1.04) translateY(-5px);
        box-shadow:
          0 0 68px rgba(255, 232, 150, 0.95),
          0 0 145px rgba(255, 195, 68, 0.65),
          inset -20px -22px 42px rgba(138, 72, 6, 0.46),
          inset 14px 14px 30px rgba(255, 255, 255, 1);
      }
    }

    @keyframes coronaPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Volumetric Light Rays Burst on Moon Click */
    .volumetric-burst {
      position: fixed;
      inset: 0;
      z-index: 43;
      pointer-events: none;
      opacity: 0;
      background:
        conic-gradient(from 0deg at 50% 46%,
          transparent 0deg, rgba(255, 243, 176, 0.45) 18deg, transparent 36deg,
          transparent 72deg, rgba(255, 224, 130, 0.5) 92deg, transparent 114deg,
          transparent 155deg, rgba(255, 248, 214, 0.45) 175deg, transparent 198deg,
          transparent 240deg, rgba(255, 213, 79, 0.45) 260deg, transparent 285deg,
          transparent 320deg, rgba(255, 243, 176, 0.45) 340deg, transparent 360deg),
        radial-gradient(circle at 50% 46%, rgba(255, 252, 230, 0.98) 0%, rgba(255, 208, 86, 0.62) 34%, transparent 72%);
    }

    .volumetric-burst.active {
      animation: volumetricReveal 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes volumetricReveal {
      0% { opacity: 0; transform: scale(0.25) rotate(-15deg); }
      28% { opacity: 1; transform: scale(1.15) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.9) rotate(18deg); }
    }

    /* Stage 2: Revealed Pixar-Style 3D Cosmic Scene */
    .invitation-stage {
      opacity: 0;
      transform: scale(0.93) translateY(16px);
      transition: opacity 0.95s ease 0.38s, transform 1s cubic-bezier(0.22, 1, 0.36, 1) 0.38s;
    }

    .invitation-stage.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Realistic 3D Cratered Full Moon Inside Poster */
    .realistic-card-moon {
      background: radial-gradient(circle at 38% 32%, #fffef7 0%, #fdf2cf 45%, #edd294 82%, #cfa55b 100%);
      box-shadow:
        0 0 42px rgba(255, 235, 165, 0.72),
        0 0 95px rgba(255, 200, 87, 0.36),
        inset -16px -18px 34px rgba(154, 112, 48, 0.38),
        inset 10px 10px 24px rgba(255, 255, 255, 0.95);
    }

    /* Smooth 60fps Floating Animations */
    .float-astronaut { animation: floatAstro 4.4s ease-in-out infinite; }
    .float-rocket { animation: floatRocket 3.2s ease-in-out infinite; }
    .float-planet { animation: floatPlanet 5.8s ease-in-out infinite; }
    .float-mini-moon { animation: floatMiniMoon 4.8s ease-in-out infinite; }

    @keyframes floatAstro {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-9px) rotate(2.5deg); }
    }

    @keyframes floatRocket {
      0%, 100% { transform: translate(0, 0) rotate(-3deg); }
      50% { transform: translate(4px, -7px) rotate(2deg); }
    }

    @keyframes floatPlanet {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes floatMiniMoon {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(6deg); }
    }

    /* Luminous Glass-and-Gold Cosmic Detail Badges */
    .cosmic-gold-card {
      background: linear-gradient(160deg, rgba(11, 22, 58, 0.82) 0%, rgba(6, 13, 38, 0.92) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 216, 107, 0.38);
      box-shadow:
        0 18px 45px rgba(2, 5, 18, 0.78),
        inset 0 1px 0 rgba(255, 245, 200, 0.22);
    }

    .cosmic-badge-row {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 215, 110, 0.08) 100%);
      border: 1px solid rgba(255, 216, 107, 0.22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
